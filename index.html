<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AegisNet: AI Personal Safety & Community Guardian</title>
    
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: {
                            50: '#f0f3fa',
                            100: '#dde4f2',
                            200: '#c0cee9',
                            300: '#94afd9',
                            400: '#6289c5',
                            500: '#3f6ab1',
                            600: '#2f5293',
                            700: '#274379',
                            800: '#233a65',
                            900: '#1d2f52',
                            950: '#0b1323',
                        },
                        emerald: {
                            500: '#10b981',
                        },
                        amber: {
                            500: '#f59e0b',
                        },
                        red: {
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                        }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'ping-slow': 'ping 2s cubic-bezier(0, 0, 0.2, 1) infinite',
                        'sonar': 'sonar 1.5s ease-in-out infinite',
                    },
                    keyframes: {
                        sonar: {
                            '0%': { transform: 'scale(0.95)', opacity: '0.8', boxShadow: '0 0 0 0 rgba(239, 68, 68, 0.7)' },
                            '70%': { transform: 'scale(1.1)', opacity: '0.3', boxShadow: '0 0 0 20px rgba(239, 68, 68, 0)' },
                            '100%': { transform: 'scale(0.95)', opacity: '0.8', boxShadow: '0 0 0 0 rgba(239, 68, 68, 0)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Leaflet.js Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel Standalone for browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Custom global styles to fix Leaflet map appearance and scroll behaviors -->
    <style>
        .leaflet-container {
            font-family: inherit;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Custom dark theme style overrides for Leaflet map tiles */
        .dark .leaflet-tile {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
        }
        .leaflet-bar {
            border: none !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06) !important;
        }
        .leaflet-bar a {
            background-color: white !important;
            color: #1e293b !important;
            border-bottom: 1px solid #f1f5f9 !important;
        }
        .dark .leaflet-bar a {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-bottom: 1px solid #334155 !important;
        }
        .leaflet-popup-content-wrapper {
            background-color: white !important;
            color: #1e293b !important;
            border-radius: 0.75rem !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
        }
        .dark .leaflet-popup-content-wrapper {
            background-color: #1e293b !important;
            color: #f8fafc !important;
        }
        .leaflet-popup-tip {
            background-color: white !important;
        }
        .dark .leaflet-popup-tip {
            background-color: #1e293b !important;
        }
        /* Hide scrollbars for absolute clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-navy-950 text-slate-800 dark:text-slate-100 transition-colors duration-200 overflow-hidden font-sans">
    
    <div id="root" class="h-full flex flex-col"></div>
    
    <!-- Load our React App -->
    <script type="text/jsx" src="app.js"></script>
    
</body>
</html>
